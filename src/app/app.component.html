
<ion-app>
  <ion-menu contentId="main-content" menuId="main-menu">
    <ion-header>
      <ion-toolbar color="primary" class="menu-toolbar">
        <ion-title>UrbanInspect</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list lines="none">
        <ion-menu-toggle autoHide="true">
          <ion-item class="menu-item" routerLink="/dashboard" routerDirection="root">
            <ion-icon name="grid-outline" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item class="menu-item" routerLink="/incidencias" routerDirection="root">
            <ion-icon name="list-outline" slot="start"></ion-icon>
            <ion-label>Incidencias</ion-label>
          </ion-item>

          <ion-item class="menu-item" routerLink="/seguimiento" routerDirection="root">
            <ion-icon name="bookmark-outline" slot="start"></ion-icon>
            <ion-label>Seguimiento</ion-label>
          </ion-item>

          <ion-item class="menu-item" routerLink="/incidencia-form" routerDirection="root">
            <ion-icon name="add-circle-outline" slot="start"></ion-icon>
            <ion-label>Nueva incidencia</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <div class="ion-page app-shell" id="main-content">
    <ion-header>
      <ion-toolbar class="app-header">
        <ion-buttons slot="start">
          <ion-menu-button class="menu-button"></ion-menu-button>
        </ion-buttons>

        <ion-title>UrbanInspect</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
  </div>
</ion-app>
